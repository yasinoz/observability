services:

  node-exporter:
    image: prom/node-exporter:v1.9.1
    build:
      context: ./node-exporter

  prometheus:
    image: prom/prometheus:v3.15.0
    build:
      context: ./prometheus

  grafana:
    image: grafana/grafana:13.2.4
    build:
      context: ./grafana

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    build:
      context: ./jaeger