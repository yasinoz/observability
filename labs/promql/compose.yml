services:

  prometheus:
    image: prom/prometheus:v3.15.0
    ports: 
      - 9090:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - metrics

  fulfilment-processor-1:
    image: courselabs/fulfilment-processor@sha256:578bc38424a1891bbe613925a04e27461fd6cad36de31a2efdbab0acb5d19b26
    environment:
      - Observability__Metrics__IncludeRuntime=true
    networks: 
      - fulfilment
      - metrics

  fulfilment-processor-2:
    image: courselabs/fulfilment-processor@sha256:578bc38424a1891bbe613925a04e27461fd6cad36de31a2efdbab0acb5d19b26
    environment:
      - Observability__Metrics__IncludeRuntime=true
      - Observability__Metrics__Factor=3
    networks: 
      - fulfilment
      - metrics

  fulfilment-processor-3:
    image: courselabs/fulfilment-processor@sha256:578bc38424a1891bbe613925a04e27461fd6cad36de31a2efdbab0acb5d19b26
    environment:
      - Observability__Metrics__IncludeRuntime=true
      - Observability__Metrics__Factor=0.5
      - Observability__Metrics__FailureFactor=0.3
      - Observability__Metrics__AppVersion=1.5.2
    networks: 
      - fulfilment
      - metrics

networks: 
  fulfilment:
  metrics:
    name: obsfun-metrics
