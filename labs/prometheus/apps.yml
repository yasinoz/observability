services:

  node-exporter:
    image: prom/node-exporter:v1.9.1
    networks: 
      - metrics

  fulfilment-api:
    image: courselabs/fulfilment-api@sha256:ee65224fb578b2ff909358edb1e488e25dd8fafdac668bba97d26825a9b8278c
    ports:
      - 8080:80
    networks: 
      - fulfilment
      - metrics

  fulfilment-processor:
    image: courselabs/fulfilment-processor@sha256:578bc38424a1891bbe613925a04e27461fd6cad36de31a2efdbab0acb5d19b26
    environment:
      - Observability__Metrics__IncludeRuntime=true
    networks: 
      - fulfilment
      - metrics

networks: 
  fulfilment:
  metrics:
    name: obsfun-metrics
